name: Slim Release

# Собирает xray только под linux/amd64 и linux/arm64 и кладёт в релиз
# распакованными бинарниками, без архивов и без geodat-ресурсов.
#
# Пониженные буферы для серверов/транзитов (см. XTLS/Xray-core#6268,
# golang/go#79831):
#   - пайпы диспетчера (512k -> 64k на пайп) правятся прямо в исходниках
#     ветки, в features/policy/policy.go — это основной расход памяти;
#   - скретч h2-аплоада x/net (512k -> 32k на стрим) нужен только когда сервер
#     сам ходит XHTTP-клиентом к следующему хопу (транзиты), правится тут в CI
#     через vendor, чтобы не тащить всё дерево зависимостей в git.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или SHA, который собирать"
        required: true
        default: feat/xhttp-mux-cool
      tag:
        description: "Тег релиза (будет создан, если его ещё нет)"
        required: true
      prerelease:
        description: "Пометить релиз как pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lower h2 uplink scratch buffer (x/net)
        run: |
          set -eux
          go mod vendor
          T=vendor/golang.org/x/net/http2/transport.go
          grep -Fq 'const max = 512 << 10' "$T" \
            || { echo "frameScratchBufferLen no longer has the expected shape" >&2; exit 1; }
          sed -i 's/const max = 512 << 10/const max = 32 << 10/' "$T"
          grep -Fq 'const max = 32 << 10' "$T" \
            || { echo "h2 scratch patch did not apply" >&2; exit 1; }

      - name: Build
        run: |
          set -eux
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -mod=vendor -v -trimpath -ldflags "-s -w -buildid=" -o "xray-linux-$arch" ./main
          done
          sha256sum xray-linux-* | tee sha256sums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            ARGS=(--target "$(git rev-parse HEAD)" --title "$TAG")
            if [ -f .github/RELEASE_NOTES.md ]; then
              ARGS+=(--notes-file .github/RELEASE_NOTES.md)
            else
              ARGS+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "${ARGS[@]}"
          fi
          gh release upload "$TAG" xray-linux-amd64 xray-linux-arm64 sha256sums.txt --clobber
