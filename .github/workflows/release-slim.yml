name: Slim Release

# Собирает xray только под linux/amd64 и linux/arm64 и кладёт в релиз
# распакованными бинарниками, без архивов и без geodat-ресурсов.
#
# Пониженные буферы для серверов/транзитов (см. XTLS/Xray-core#6268,
# golang/go#79831):
#   - пайпы диспетчера (512k -> 64k на пайп) правятся прямо в исходниках
#     ветки, в features/policy/policy.go — это основной расход памяти;
#   - скретч h2-аплоада (512k -> 32k на стрим) нужен, когда узел сам ходит
#     XHTTP-клиентом к следующему хопу (транзиты). Под Go 1.27 http2.Transport
#     из x/net оборачивает net/http, и рабочий буфер живёт в стандартной
#     библиотеке; с http2legacy — в самом x/net. Патчатся оба, здесь в CI,
#     чтобы ограничение действовало с любым из транспортов.
#
# BUILD_TAGS=http2legacy возвращает собственный пул соединений x/net: под
# Go 1.27 без него каждый запрос, ждущий зависший TLS-хендшейк, открывает свой
# TCP, и xmux.maxConnections перестаёт ограничивать сокеты
# (XTLS/Xray-core#6797). Убрать, когда это починят в Xray или Go.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или SHA, который собирать"
        required: true
        default: feat/xhttp-mux-cool
      tag:
        description: "Тег релиза (будет создан, если его ещё нет)"
        required: true
      prerelease:
        description: "Пометить релиз как pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      BUILD_TAGS: http2legacy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lower h2 uplink scratch buffer
        run: |
          set -eux
          patch_scratch() {
            grep -Fq 'const max = 512 << 10' "$1" \
              || { echo "frameScratchBufferLen changed shape in $1" >&2; exit 1; }
            chmod u+w "$1"
            sed -i 's/const max = 512 << 10/const max = 32 << 10/' "$1"
            grep -Fq 'const max = 32 << 10' "$1" \
              || { echo "h2 scratch patch did not apply to $1" >&2; exit 1; }
          }
          patch_scratch "$(go env GOROOT)/src/net/http/internal/http2/transport.go"
          go mod vendor
          patch_scratch vendor/golang.org/x/net/http2/transport.go
          files=" $(go list -mod=vendor -tags "$BUILD_TAGS" -f '{{join .GoFiles " "}}' golang.org/x/net/http2) "
          case ",$BUILD_TAGS," in
            *,http2legacy,*)
              case "$files" in
                *" transport.go "*) ;;
                *) echo "http2legacy no longer selects x/net's own transport" >&2; exit 1 ;;
              esac ;;
          esac

      - name: Build
        run: |
          set -eux
          go version
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -mod=vendor -tags "$BUILD_TAGS" -v -trimpath -ldflags "-s -w -buildid=" -o "xray-linux-$arch" ./main
          done
          sha256sum xray-linux-* | tee sha256sums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            ARGS=(--target "$(git rev-parse HEAD)" --title "$TAG")
            if [ -f .github/RELEASE_NOTES.md ]; then
              ARGS+=(--notes-file .github/RELEASE_NOTES.md)
            else
              ARGS+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "${ARGS[@]}"
          fi
          gh release upload "$TAG" xray-linux-amd64 xray-linux-arm64 sha256sums.txt --clobber
